[project]
name = "badge-lgbt-scripts"
version = "2026.0"
description = "Host tooling for the badge.lgbt badge: image conversion and the serial controller."
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pillow>=10.0",
    "pyserial>=3.5",
]

[project.scripts]
badge-ctl = "controller:main"
badge-img = "convert_image:import_img"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["controller.py", "convert_image.py"]
